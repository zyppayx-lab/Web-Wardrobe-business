<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Business Login | Web Wardrobe</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#fafafa;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:white;
padding:35px;
border-radius:24px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.logo{
font-size:32px;
font-weight:800;
color:#e60023;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:30px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
margin-bottom:20px;
font-size:15px;
}

button{
width:100%;
padding:15px;
border:none;
background:#e60023;
color:white;
font-weight:700;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:0.95;
}

.message{
margin-top:20px;
text-align:center;
font-size:14px;
}

.signup-link{
text-align:center;
margin-top:20px;
}

.signup-link a{
color:#e60023;
font-weight:700;
text-decoration:none;
}

</style></head><body><div class="card"><div class="logo">Web Wardrobe</div><p class="subtitle">
Login to your business account
</p><form id="loginForm"><label>Email Address</label>
<input type="email" id="email" required>

<label>Password</label>
<input type="password" id="password" required>

<button type="submit">
Login
</button></form><div id="message" class="message"></div><div class="signup-link">
Don't have an account?
<a href="signup.html">Create Account</a>
</div></div><script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const form = document.getElementById("loginForm");

const message = document.getElementById("message");

onAuthStateChanged(auth,(user)=>{

if(user){
location.href = "dashboard.html";
}

});

form.addEventListener("submit", async (e)=>{

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

message.textContent =
"Login successful.";

setTimeout(()=>{
location.href="dashboard.html";
},1000);

}catch(error){

message.textContent =
"Login failed. Check your email and password.";

}

});

</script></body>
        </html>
