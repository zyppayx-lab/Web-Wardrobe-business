<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Business</title>

<style>
body{
font-family:Inter,sans-serif;
background:#fafafa;
max-width:800px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 18px rgba(0,0,0,.06);
}

input,textarea,select{
width:100%;
padding:14px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:12px;
}

button{
background:#e60023;
color:white;
border:none;
padding:14px 20px;
border-radius:12px;
cursor:pointer;
font-weight:700;
}

.preview{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
margin-top:10px;
}
</style>
</head>
<body>

<div class="card">

<h2>Create Business</h2>

<input id="name" placeholder="Business Name">

<textarea id="description"
placeholder="Business Description"></textarea>

<select id="category">
<option>Fashion</option>
<option>Furniture</option>
<option>Interior</option>
<option>Lifestyle</option>
<option>Technology</option>
<option>Beauty</option>
</select>

<input id="website"
placeholder="https://yourwebsite.com">

<input type="file"
id="logoInput"
accept="image/*">

<img id="preview"
class="preview">

<button id="submitBtn">
Create Business
</button>

<p id="message"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyBoSJggPoHfiI2quek_5mV5gPSAhSaXFZE",
authDomain: "web-wardrobe.firebaseapp.com",
projectId: "web-wardrobe",
storageBucket: "web-wardrobe.appspot.com",
messagingSenderId: "201587857341",
appId: "1:201587857341:web:044fe04f2503168881a4d4"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

let currentUser = null;

onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="index.html";
return;

}

currentUser = user;

});

let logoBase64 = "";

const logoInput =
document.getElementById("logoInput");

logoInput.addEventListener("change",(e)=>{

const file = e.target.files[0];

const reader = new FileReader();

reader.onload = ()=>{

logoBase64 = reader.result;

document.getElementById("preview")
.src = logoBase64;

};

reader.readAsDataURL(file);

});

document
.getElementById("submitBtn")
.addEventListener("click", async()=>{

try{

await addDoc(
collection(db,"businesses"),
{

ownerId: currentUser.uid,

ownerName: currentUser.displayName,

ownerEmail: currentUser.email,

name:
document.getElementById("name").value,

description:
document.getElementById("description").value,

category:
document.getElementById("category").value,

website:
document.getElementById("website").value,

logo: logoBase64,

rating: 0,

reviewCount: 0,

approved: false,

createdAt: serverTimestamp()

}
);

document.getElementById("message")
.innerHTML =
"Business submitted for approval.";

}catch(error){

console.error(error);

}

});

</script>

</body>
  </html>
