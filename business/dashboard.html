<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web Wardrobe Business</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#fafafa;
color:#111;
}

header{
background:white;
padding:18px 24px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:800;
color:#e60023;
}

.login-btn{
background:#e60023;
color:white;
border:none;
padding:12px 18px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.hero{
max-width:1200px;
margin:auto;
padding:80px 20px;
text-align:center;
}

.hero h1{
font-size:56px;
margin-bottom:20px;
}

.hero p{
max-width:700px;
margin:auto;
color:#666;
line-height:1.8;
}

.section{
max-width:1200px;
margin:auto;
padding:20px;
}

.section-title{
font-size:32px;
font-weight:800;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.card img{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

.card h3{
margin-bottom:10px;
}

.card p{
color:#666;
line-height:1.6;
}

.rating{
margin-top:10px;
font-weight:700;
color:#e60023;
}

footer{
text-align:center;
padding:40px;
margin-top:50px;
color:#777;
}
</style>
</head>
<body>

<header>
<div class="logo">Web Wardrobe Business</div>

<button class="login-btn" id="loginBtn">
Login with Google
</button>
</header>

<section class="hero">
<h1>Grow Your Business With Web Wardrobe</h1>

<p>
Create your business profile, publish posts,
add affiliate links, receive reviews,
and promote sponsored content.
</p>
</section>

<section class="section">
<h2 class="section-title">Featured Businesses</h2>

<div class="grid" id="businessGrid"></div>
</section>

<footer>
© 2026 Web Wardrobe Business
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
limit,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "web-wardrobe.firebaseapp.com",

projectId: "web-wardrobe",

storageBucket: "web-wardrobe.appspot.com",

messagingSenderId: "201587857341",

appId: "1:201587857341:web:044fe04f2503168881a4d4"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async () => {

try {

await signInWithPopup(auth, provider);

location.href = "dashboard.html";

} catch(error){

console.error(error);

}

});

onAuthStateChanged(auth,(user)=>{

if(user){

location.href = "dashboard.html";

}

});

const businessGrid =
document.getElementById("businessGrid");

async function loadBusinesses(){

const q = query(
collection(db,"businesses"),
where("approved","==",true),
limit(12)
);

const snap = await getDocs(q);

businessGrid.innerHTML = "";

snap.forEach(docSnap=>{

const business = docSnap.data();

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<img src="${business.logo || ''}">

<h3>${business.name}</h3>

<p>${business.description || ''}</p>

<div class="rating">
⭐ ${business.rating || 0}
(${business.reviewCount || 0} reviews)
</div>
`;

businessGrid.appendChild(card);

});

}

loadBusinesses();

</script>

</body>
  </html>
